[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kodingdiagram"
version = "0.1.0"
description = "Qualitative Data Analysis toolkit with NLP, coding, theming, and network visualization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "kodingdiagram contributors" }
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "spacy>=3.7.0",
    "networkx>=3.2",
    "matplotlib>=3.8.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[project.scripts]
kodingdiagram = "kodingdiagram.main:cli"

[tool.ruff]
target-version = "py310"
line-length = 100
